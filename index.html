<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Vina</title>

    <!-- CSS External -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Scipt Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <!-- Header Content -->
    <header>
        <h1>Todo List Website - Vina</h1>
    </header>

    <!--Main Content  -->
    <main>
        <!-- Form Section -->
        <section>
            <form>
                <!-- Todo Input -->
                <input type="text" id="todo-input" placeholder="Enter a new todo list">

                <!-- Todo Date -->
                <input type="date" id="todo-date" placeholder="Enter due date">
            </form>
            
            <!-- Add Button -->
             <button type="button">Add Todo</button>
        </section>
        
    </main>

    <!-- Footer Content -->
    <footer></footer>

    <!-- JS External -->
     <script src="js/script.js"></script>
</body>
</html>
